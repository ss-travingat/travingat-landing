<!DOCTYPE html>
<html>
<head>
<style>
.card {
  position: relative;
  width: 100px;
  height: 100px;
  border: 1px solid black;
  padding: 20px;
}
.inner {
  width: 100%;
  height: 100%;
  background: red;
}
.abs {
  position: absolute;
  top: 0;
  left: 0;
  width: 10px;
  height: 10px;
  background: blue;
}
</style>
</head>
<body>
<div class="card">
  <div class="inner"></div>
  <div class="abs"></div>
</div>
</body>
</html>
